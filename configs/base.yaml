# Relative paths are resolved from the working directory. Run at repository root.
model:
  base_path: ${PRISM_MODEL:-Qwen/Qwen3-VL-8B-Instruct}
  resume_adapter: null
  dtype: bf16
  trust_remote_code: false
  attn_implementation: sdpa
  device_map: null

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  freeze_visual: true

data:
  root: ["${PRISM_DATA:-data/oraclegraph}"]
  train_val_split: 0.98
  split_seed: 42
  keep_full_polygon: false

rollout:
  backend: hf
  group_size: 2
  max_new_tokens: 3072
  temperature: 0.7
  top_p: 0.95
  hf:
    device: ${PRISM_ROLLOUT_DEVICE:-cuda:1}
    max_batch: 1
  sglang:
    base_url: ${PRISM_SGLANG_URL:-http://127.0.0.1:30000/v1}
    timeout_s: 600

feedback:
  mode: auto
  success_threshold: 0.5
  max_diff_items: 30
  max_chars_per_item: 200

sdpo:
  top_k: 100
  jsd: true
  importance_clip_eps: 0.1
  reward_weighted: true
  reward_weighted_tau: 0.5
  dpo_aux_alpha: 0.2
  dpo_aux_beta: 2.5
  per_rollout_backward: false
  teacher:
    mode: ema
    ema_alpha: 0.999

train:
  output_dir: ${PRISM_OUTPUT:-outputs}
  run_name: prism_seed42
  max_steps: 100
  micro_bsz: 1
  grad_accum: 1
  lr: 3.0e-7
  lr_schedule: constant
  warmup_steps: 10
  weight_decay: 0.0
  grad_clip: 1.0
  n_sync: 20
  log_interval: 1
  save_interval: 20
  seed: 42

# Historical section name; the trainer is single-process, without DeepSpeed.
deepspeed:
  gradient_checkpointing: true
